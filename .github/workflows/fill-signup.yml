name: Instagram Signup Form Filler

"on":
  workflow_dispatch:

jobs:
  fill-signup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run signup filler script
        run: python fill_signup.py

      - name: Upload screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-signup-screenshots
          path: |
            instagram_signup_filled.png
            instagram_captcha_modal.png
            instagram_captcha_clicked.png
            error_missing_element.png
          if-no-files-found: warn
          retention-days: 30
